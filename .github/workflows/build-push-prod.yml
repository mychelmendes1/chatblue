# =============================================================================
# ChatBlue - Build and Push Docker Images (prod)
# =============================================================================
# Correcoes aplicadas:
# - Adicionado --fail nos curls do Portainer (falha visivel se webhook falhar)
# - Adicionado concurrency para evitar builds simultaneos
# - Adicionado step de verificacao de secrets obrigatorios
# - Adicionado validacao de que NEXT_PUBLIC_API_URL_PROD nao pode estar vazio
# =============================================================================

name: Build and Push Docker Images (prod)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

# Impede builds de producao simultaneos
concurrency:
  group: build-prod
  cancel-in-progress: false

env:
  AWS_REGION: ${{ secrets.AWS_REGION || 'us-east-2' }}
  AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}

jobs:
  build-and-push-prod:
    name: Build and push images to ECR (prod)
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: prod
      ECR_REGISTRY: 724698481758.dkr.ecr.us-east-2.amazonaws.com
      API_REPOSITORY: chatblue-api-prod
      WEB_REPOSITORY: chatblue-web-prod
      MIGRATION_REPOSITORY: chatblue-migration-prod

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # CORRECAO: Verifica se secrets criticos estao configurados
      - name: Verificar secrets obrigatorios
        run: |
          MISSING=""
          [ -z "${{ secrets.AWS_ACCESS_KEY_ID }}" ] && MISSING="$MISSING AWS_ACCESS_KEY_ID"
          [ -z "${{ secrets.AWS_SECRET_ACCESS_KEY }}" ] && MISSING="$MISSING AWS_SECRET_ACCESS_KEY"
          [ -z "${{ secrets.NEXT_PUBLIC_API_URL_PROD }}" ] && MISSING="$MISSING NEXT_PUBLIC_API_URL_PROD"
          [ -z "${{ secrets.NEXT_PUBLIC_SOCKET_URL_PROD }}" ] && MISSING="$MISSING NEXT_PUBLIC_SOCKET_URL_PROD"

          if [ -n "$MISSING" ]; then
            echo "ERRO: Os seguintes secrets nao estao configurados:$MISSING"
            echo "Configure-os em Settings > Secrets and variables > Actions"
            exit 1
          fi
          echo "Todos os secrets obrigatorios estao presentes."

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Ensure ECR repositories exist
        run: |
          set -e
          aws ecr describe-repositories --repository-names "$API_REPOSITORY" >/dev/null 2>&1 || \
            aws ecr create-repository --repository-name "$API_REPOSITORY"

          aws ecr describe-repositories --repository-names "$WEB_REPOSITORY" >/dev/null 2>&1 || \
            aws ecr create-repository --repository-name "$WEB_REPOSITORY"

          aws ecr describe-repositories --repository-names "$MIGRATION_REPOSITORY" >/dev/null 2>&1 || \
            aws ecr create-repository --repository-name "$MIGRATION_REPOSITORY"

      - name: Set image tag
        id: tag
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            echo "tag=${GITHUB_SHA}" >> $GITHUB_OUTPUT
          fi

      - name: Build and push Docker images (prod)
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL_PROD }}
          NEXT_PUBLIC_SOCKET_URL: ${{ secrets.NEXT_PUBLIC_SOCKET_URL_PROD }}
          NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${{ secrets.NEXT_PUBLIC_VAPID_PUBLIC_KEY_PROD || '' }}
        run: |
          set -e
          IMAGE_TAG="${{ steps.tag.outputs.tag }}"

          echo "Using registry: $ECR_REGISTRY"
          echo "Building images with tag: $IMAGE_TAG"

          # API (backend)
          docker build \
            -f docker/Dockerfile.api \
            -t "$ECR_REGISTRY/$API_REPOSITORY:$IMAGE_TAG" \
            -t "$ECR_REGISTRY/$API_REPOSITORY:latest" \
            .

          # Web (frontend) com build-args para Next.js
          docker build \
            --build-arg NEXT_PUBLIC_API_URL="$NEXT_PUBLIC_API_URL" \
            --build-arg NEXT_PUBLIC_SOCKET_URL="$NEXT_PUBLIC_SOCKET_URL" \
            --build-arg NEXT_PUBLIC_VAPID_PUBLIC_KEY="$NEXT_PUBLIC_VAPID_PUBLIC_KEY" \
            -f docker/Dockerfile.web \
            -t "$ECR_REGISTRY/$WEB_REPOSITORY:$IMAGE_TAG" \
            -t "$ECR_REGISTRY/$WEB_REPOSITORY:latest" \
            .

          # Migration usa a mesma imagem da API (Prisma migrate deploy)
          docker tag "$ECR_REGISTRY/$API_REPOSITORY:$IMAGE_TAG" "$ECR_REGISTRY/$MIGRATION_REPOSITORY:$IMAGE_TAG"
          docker tag "$ECR_REGISTRY/$API_REPOSITORY:latest" "$ECR_REGISTRY/$MIGRATION_REPOSITORY:latest"

          docker push "$ECR_REGISTRY/$API_REPOSITORY:$IMAGE_TAG"
          docker push "$ECR_REGISTRY/$API_REPOSITORY:latest"

          docker push "$ECR_REGISTRY/$WEB_REPOSITORY:$IMAGE_TAG"
          docker push "$ECR_REGISTRY/$WEB_REPOSITORY:latest"

          docker push "$ECR_REGISTRY/$MIGRATION_REPOSITORY:$IMAGE_TAG"
          docker push "$ECR_REGISTRY/$MIGRATION_REPOSITORY:latest"

      # CORRECAO: Adicionado --fail e --silent --show-error para falhar explicitamente
      - name: Atualizar API no Portainer (prod)
        if: success()
        run: |
          curl --fail --silent --show-error -X POST \
            "${{ secrets.PORTAINER_WEBHOOK_API_PROD }}?tag=${{ steps.tag.outputs.tag }}" \
            || (echo "ERRO: Webhook do Portainer para API falhou" && exit 1)

      - name: Atualizar Web no Portainer (prod)
        if: success()
        run: |
          curl --fail --silent --show-error -X POST \
            "${{ secrets.PORTAINER_WEBHOOK_WEB_PROD }}?tag=${{ steps.tag.outputs.tag }}" \
            || (echo "ERRO: Webhook do Portainer para Web falhou" && exit 1)

      - name: Executar migration no Portainer (prod)
        if: success()
        run: |
          curl --fail --silent --show-error -X POST \
            "${{ secrets.PORTAINER_WEBHOOK_MIGRATION_PROD }}?tag=${{ steps.tag.outputs.tag }}" \
            || (echo "ERRO: Webhook do Portainer para Migration falhou" && exit 1)
